<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>India + USA Flight Explorer — Demo</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="style.css"><script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script defer src="app.js"></script></head><body><header><div class="identity"><span class="logo" aria-hidden="true">↗</span><div><h1>Airspace explorer</h1><p>India + USA</p></div></div><span class="demo">FICTIONAL PROTOTYPE · NOT LIVE</span></header><main><section class="toolbar" aria-label="Flight controls"><div class="countries"><button id="india" aria-pressed="true">India</button><button id="usa" aria-pressed="false">USA</button></div><label class="region-label">Region<select id="region"></select></label><form id="search"><label class="sr" for="query">Search demo callsign, tail, ID or route</label><input id="query" placeholder="Search DEMO101, tail or route…" type="search"><button>Find</button></form></section><div class="workspace"><section class="map-panel" aria-label="Fictional aircraft map"><div id="map"></div><p id="map-error" hidden>The map couldn’t load. You can still browse every sample below.</p><button class="area-button" id="area">Show samples in this area</button><span class="map-note">Static fictional positions · no tracking feed</span></section><section class="board"><div class="board-head"><div><h2 id="count"></h2><p id="context"></p></div><button id="saved" aria-pressed="false">Saved</button></div><label class="sr" for="filter">Filter displayed aircraft</label><input id="filter" placeholder="Filter this view…" type="search"><div id="list"></div></section></div></main><dialog id="detail"><div id="detail-content"></div></dialog><footer>Interactive demo only. No real flight status, schedules or arrival estimates. Favorites are stored only in this browser.</footer></body></html>
